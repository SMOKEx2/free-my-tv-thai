# Copy to config.properties. This template intentionally contains no TMDB credential or device address.
# setup.cmd asks these questions and saves your own choices locally.
tmdb_key=
tmdb_region=US
latitude=0
longitude=0
city=
# auto, th, en (also retains upstream pt and es)
language=auto
temperature=auto
show_crypto=false
currency=USD
disable_assistant=false
# Optional Xiaomi advertising/analytics cleanup; essential services and updates are preserved.
clean_ads=false
# Comma-separated installed Android package IDs, in your preferred order. No fixed count.
# Empty opens the on-TV app picker. Example format: package.one,package.two
shelf_packages=
